name: deploy-pages

# เผยแพร่เฉพาะไฟล์ของแอป (ไม่รวม node_modules, tests, e2e, supabase) ไปที่ GitHub Pages
# ต้องตั้งค่าครั้งเดียวที่ repo › Settings › Pages › Source = "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
